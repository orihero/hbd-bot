# Alembic configuration.
#
# It lives beside the migrations rather than at the repository root so the whole
# migration story is one directory. Run it with an explicit -c:
#
#     alembic -c migrations/alembic.ini upgrade head
#     alembic -c migrations/alembic.ini revision --autogenerate -m "add x"
#
# The database URL is NOT stored here. env.py reads HBD_DATABASE_URL through
# hbd.config, so there is exactly one place a DSN is configured and no credential
# ever lands in a tracked file.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../src
path_separator = os
# UTC, sortable, and the slug keeps `ls versions/` readable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
