<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>hbd admin</title>
    <!--
      The per-response style nonce, and the only dynamic thing in this file.

      `content` is the literal token `hbd.admin.shell.CSP_NONCE_PLACEHOLDER`. The API
      substitutes this response's nonce for it as it serves the shell (`_serve_spa_index` in
      src/hbd/admin/app.py); the shell is already `no-store`, and `/assets/*` stays
      byte-identical and immutable. `src/lib/csp.ts` reads it once at boot and hands it to
      `get-nonce`, which is what `react-remove-scroll` — mounted by every Radix modal — asks
      before it injects its scroll-lock <style> element. Without it that element carries no
      nonce, `style-src 'self' 'nonce-…'` blocks it, and the background scrolls under an
      open confirm dialog with nothing but a console violation to say so.

      In `vite dev` there is no server to substitute anything, so the token survives
      verbatim; csp.ts recognises it and treats it as "no nonce", which is correct — the
      dev server sends no CSP.

      It is a meta element and NOT an inline <script> assigning a global, because
      `script-src` is 'self' with no nonce of its own and must stay that way.
    -->
    <meta name="csp-nonce" content="__HBD_CSP_NONCE__" />
    <!--
      No <link> to a font CDN, and no inline <style>.

      The panel is served under `default-src 'self'` with `style-src 'self' 'nonce-…'`
      (§12.1 T7). A Google Fonts stylesheet would be blocked by the policy rather than
      merely slow. Vite emits one external stylesheet; that is 'self' and needs no nonce.

      Fonts are self-hosted, which is the other half of T7 and was for a long time the
      missing half. Four woff2 binaries live in `src/assets/fonts/`, `src/styles/fonts.css`
      declares them and owns the stacks, and `default-src 'self'` covers `font-src` — so
      the policy needs no font host and must never be given one.

      There is no <link rel="preload"> written here because the body face's filename carries
      a content hash. `preloadBodyFont()` in vite.config.ts injects it at build time, at the
      top of <head>, and FAILS THE BUILD if the file it is looking for is not in the bundle.
      Serving the font from `public/` instead would not work: the API mounts StaticFiles
      under `/assets/` alone and answers every other path with this shell.

      The `data-theme` attribute is stamped onto <html> by usePrefsStore before first paint
      (see src/main.tsx). LIGHT is the default palette: `:root` in tokens.css carries it and
      `[data-theme="dark"]` overrides it, so a document with no attribute at all — this file,
      for the instant before initTheme() runs — is already the palette the console is
      designed in, and there is no flash of the wrong one.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>The hbd admin console needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
