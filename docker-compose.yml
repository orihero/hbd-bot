# Local dependencies only: Postgres 16 and Redis 7.
# The bot and worker run on the host (`make dev`, `make worker`) so a reload is instant.
#
#   docker compose up -d      start
#   docker compose down       stop, keep data
#   docker compose down -v    stop and wipe data
#
# TWO POSTGRES ROLES (ADMIN_PANEL_PLAN §4.5). `hbd` owns the tables and runs migrations;
# `hbd_app` is what the bot, the worker and the admin API connect as. The split is what lets
# migration 0007 revoke UPDATE/DELETE/TRUNCATE on `admin_audit_log` from the application
# role and have that stick — an owner can GRANT back its own revocations, so a one-role
# deployment cannot protect the audit log with privileges at all. docker/initdb/10-two-roles.sql
# creates the second role, and the entrypoint runs it ONLY on an empty data volume:
#
#   docker compose down -v && docker compose up -d      # re-run the init script
#
#   export HBD_DB_MIGRATION_URL="postgresql+asyncpg://hbd:hbd@localhost:5432/hbd"
#   export HBD_DATABASE_URL="postgresql+asyncpg://hbd_app:hbd_app@localhost:5432/hbd"
#
# Leaving HBD_DB_MIGRATION_URL unset still works: migrations fall back to HBD_DATABASE_URL
# with a WARNING and the panel reports the audit chain as "hmac-only".

services:
  postgres:
    image: postgres:16-alpine
    container_name: hbd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hbd
      POSTGRES_PASSWORD: hbd
      POSTGRES_DB: hbd
      # Deterministic collation so ORDER BY on Uzbek and Russian text is stable.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Override when the host already runs Postgres: HBD_POSTGRES_PORT=5433 docker compose up -d
      - "${HBD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Read-only, and only ever read once: the entrypoint runs *.sql from this directory
      # on first initialisation of an empty data volume, as POSTGRES_USER against
      # POSTGRES_DB. A later edit needs `docker compose down -v`.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hbd -d hbd"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hbd-redis
    restart: unless-stopped
    # appendonly keeps FSM state and the idempotency set across a restart.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
